name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.9.0
        with:
          arch: x64

      - name: Install Ninja and Inno Setup
        run: choco install ninja innosetup --no-progress -y

      - name: Verify tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cmakeLists = Get-Content CMakeLists.txt -Raw
          if ($cmakeLists -notmatch 'project\s*\(\s*qtranslate\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Cannot read the project version from CMakeLists.txt."
          }
          $expected = "v" + $Matches[1]
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match the project version '$expected'."
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/ci --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1 `
            -BuildDir build/ci `
            -DistDir build/dist `
            -OutputDir build/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qtranslate-windows-x64
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: qtranslate-windows-x64
          path: artifacts

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="doc/releases/${version}.md"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "QTranslate ${version}" --notes-file "$notes" --latest
            else
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "QTranslate ${version}" --generate-notes --latest
            fi
          else
            if [[ -f "$notes" ]]; then
              gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" \
                --title "QTranslate ${version}" --notes-file "$notes" --latest
            else
              gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" \
                --title "QTranslate ${version}" --generate-notes --latest
            fi
          fi
